<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIGMA{% block title %}{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .hash { font-family: monospace; font-size: 0.82em; word-break: break-all; }
    .navbar-brand { letter-spacing: 0.05em; }
    body { background-color: #0d1117; }
    .card { background-color: #161b22; border-color: #30363d; }
    table { --bs-table-bg: transparent; }
    .alias-badge { font-size: 0.7em; vertical-align: middle; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark" style="background-color:#161b22;border-bottom:1px solid #30363d">
  <div class="container">
    <a class="navbar-brand fw-bold text-warning" href="/">⛓ SIGMA</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent" aria-controls="navContent" aria-expanded="false">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navContent">
      <div class="navbar-nav me-auto ms-2">
        <a class="nav-link" href="/">Explorer</a>
        <a class="nav-link" href="/wallet">Wallet</a>
        <a class="nav-link" href="/nodes-ui">Nodes</a>
      </div>
      <form class="d-flex gap-2 my-2 my-lg-0" action="/search" method="get">
        <input name="q" class="form-control form-control-sm" placeholder="Address / block # / hash / tx…" style="min-width:200px">
        <button class="btn btn-sm btn-outline-warning" type="submit">Search</button>
      </form>
    </div>
  </div>
</nav>
<div class="container mt-4 pb-5">
  {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
